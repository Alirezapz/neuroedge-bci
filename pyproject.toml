[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroedge-research"
version = "0.5.0"
description = "Reproducible EEG research with participant isolation and session-disjoint source-anchored calibration"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alireza Pazouki"}]
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "mne>=1.8,<2", "torch>=2.5,<3",
  "matplotlib>=3.9,<4", "PyYAML>=6,<7", "joblib>=1.4,<2"
]

[project.optional-dependencies]
deployment = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<10", "pyriemann>=0.7,<1"]
accuracy = ["pyriemann>=0.7,<1"]

[project.scripts]
neuroedge = "neuroedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

